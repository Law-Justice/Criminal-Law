x=\"2\"/><rect style=\"fill:var(--ink)\" x=\"115\" y=\"113\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"136\" y=\"113\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"157\" y=\"113\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"178\" y=\"113\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"199\" y=\"113\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"10\" y=\"134\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"31\" y=\"134\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"52\" y=\"134\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"73\" y=\"134\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"94\" y=\"134\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"115\" y=\"134\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"136\" y=\"134\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"157\" y=\"134\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"178\" y=\"134\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"199\" y=\"134\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"10\" y=\"155\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"31\" y=\"155\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"52\" y=\"155\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"73\" y=\"155\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"94\" y=\"155\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"115\" y=\"155\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"136\" y=\"155\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"157\" y=\"155\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"178\" y=\"155\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"199\" y=\"155\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"10\" y=\"176\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"31\" y=\"176\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"52\" y=\"176\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"73\" y=\"176\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"94\" y=\"176\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"115\" y=\"176\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"136\" y=\"176\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"157\" y=\"176\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"178\" y=\"176\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"199\" y=\"176\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--muted)\" x=\"10\" y=\"197\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--muted)\" x=\"31\" y=\"197\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--muted)\" x=\"52\" y=\"197\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--muted)\" x=\"73\" y=\"197\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--muted)\" x=\"94\" y=\"197\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--muted)\" x=\"115\" y=\"197\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--muted)\" x=\"136\" y=\"197\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--muted)\" x=\"157\" y=\"197\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--red)\" x=\"178\" y=\"197\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--red)\" x=\"199\" y=\"197\" width=\"18\" height=\"18\" rx=\"2\"/><rect style=\"fill:var(--ink)\" x=\"250\" y=\"40\" width=\"22\" height=\"22\" rx=\"3\"/><text style=\"fill:var(--ink);font:800 30px Rockwell,'Courier New',monospace\" x=\"284\" y=\"62\">90<\/text><text style=\"fill:var(--ink);font:600 17px system-ui,sans-serif\" x=\"330\" y=\"61\">pleaded guilty<\/text><rect style=\"fill:var(--muted)\" x=\"250\" y=\"98\" width=\"22\" height=\"22\" rx=\"3\"/><text style=\"fill:var(--ink);font:800 30px Rockwell,'Courier New',monospace\" x=\"284\" y=\"120\">8<\/text><text style=\"fill:var(--ink);font:600 17px system-ui,sans-serif\" x=\"330\" y=\"119\">had cases dismissed<\/text><rect style=\"fill:var(--red)\" x=\"250\" y=\"156\" width=\"22\" height=\"22\" rx=\"3\"/><text style=\"fill:var(--ink);font:800 30px Rockwell,'Courier New',monospace\" x=\"284\" y=\"178\">2<\/text><text style=\"fill:var(--ink);font:600 17px system-ui,sans-serif\" x=\"330\" y=\"177\">went to trial<\/text><text class=\"s-mut\" style=\"font-size:12px\" x=\"250\" y=\"216\">OUT OF EVERY 100 FEDERAL<\/text><text class=\"s-mut\" style=\"font-size:12px\" x=\"250\" y=\"230\">DEFENDANTS, FISCAL 2018<\/text><\/svg><\/div><div class=\"stack\"><div class=\"paper brass\"><div class=\"lbl\">THE NUMBERS<\/div><p>Nearly 80,000 people were defendants in federal criminal cases in fiscal 2018. Only about 2% went to trial. About 90% pleaded guilty and about 8% had their cases dismissed (Pew Research Center analysis of federal data).<\/p><\/div><div class=\"paper\"><div class=\"lbl\">A WIN FOR THE STATE<\/div><p>A plea deal is a win for the state. In the past, prosecutors evaluated themselves by how many convictions they secured. This has changed.<\/p><\/div><\/div><\/div><div class=\"paper\" style=\"margin-top:.8rem\"><div class=\"lbl\">WHY DEFENDANTS PLEAD<\/div><p>Most people do not want to risk a trial, even if they think they are innocent. They may not have the money for a trial. Going to trial they may face 20+ years, but they can take a plea deal for 3 years.<\/p><\/div>"}, {"t": "html", "title": "What a Guilty Plea Gives Up", "body": "<div class=\"grid g2\"><div class=\"paper\"><div class=\"lbl red\">RIGHTS WAIVED<\/div><ul><li>The right to a jury trial<\/li><li>The right to make the state prove its case beyond a reasonable doubt<\/li><li>The right to confront and cross-examine witnesses<\/li><li>The right to remain silent at trial<\/li><\/ul><\/div><div class=\"paper\"><div class=\"lbl green\">WHAT THE JUDGE CHECKS<\/div><ul><li>The plea is voluntary<\/li><li>The defendant understands the charges and consequences<\/li><li>A factual basis supports the plea<\/li><li>The judge approves the deal before it takes effect<\/li><\/ul><\/div><\/div>"}, {"t": "quiz", "id": "m1", "tag": "ACT V · EXHIBIT 52", "q": "In fiscal 2018, about 80,000 federal defendants had 2% going to trial, 90% pleading guilty, and 8% having cases dismissed. How many more defendants pleaded guilty than had cases dismissed?", "opts": ["About 72,000", "About 70,400", "About 63,000", "About 65,600", "About 56,000"], "ans": 3, "why": "90% is 72,000 and 8% is 6,400, so the difference is 72,000 − 6,400 = 65,600.", "pts": 100, "kind": "quiz"}, {"t": "quiz", "id": "m2", "tag": "ACT V · EXHIBIT 53", "q": "Suppose 400 of the 1,600 trials in that group ended in acquittal. About what share of all 80,000 defendants were acquitted at trial?", "opts": ["About 0.5%", "About 25%", "About 2%", "About 5%", "About 0.25%"], "ans": 0, "why": "400 out of 80,000 is 0.5%. The 25% is the share of trials, not of all defendants.", "pts": 100, "kind": "quiz"}, {"t": "quiz", "id": "m3", "tag": "ACT V · EXHIBIT 54", "q": "Dana is offered a 3-year plea deal. If she goes to trial and loses, she could face 20+ years. She believes she is innocent. Which consideration best explains why a rational defendant might still plead?", "opts": ["Judges require pleas from innocent defendants", "A certain 3 years can beat a risky trial with a large chance of 20+ years, plus the cost of a trial", "Guilty pleas always lead to probation", "Prosecutors cannot offer deals to innocent people", "She would lose her lawyer if she pleaded not guilty"], "ans": 1, "why": "Many defendants accept a plea to avoid risk and cost, even when they believe they are innocent.", "pts": 100, "kind": "quiz"}, {"t": "quiz", "id": "m4", "tag": "ACT V · EXHIBIT 55", "q": "Which of these is NOT something a defendant gives up by pleading guilty?", "opts": ["The right to a jury trial", "The right to confront witnesses", "The right to make the state prove guilt beyond a reasonable doubt at trial", "The right to remain silent at trial", "The right to have a lawyer"], "ans": 4, "why": "A plea waives trial rights, but the defendant still has a lawyer, and a judge reviews the plea.", "pts": 100, "kind": "quiz"}, {"t": "act", "no": "ACT VI", "title": "The Verdict", "sub": "You are the jury. Is it proof beyond a reasonable doubt?", "art": "bench"}, {"t": "quiz", "id": "v1", "tag": "ACT VI · VERDICT DESK 1", "q": "The only evidence is a witness who glimpsed the robber for two seconds at night from 100 feet away. The defendant has an alibi witness who says he was at home.", "opts": ["GUILTY", "NOT GUILTY"], "ans": 1, "why": "A weak identification plus an alibi leaves reasonable doubt, so the verdict is not guilty.", "pts": 75, "kind": "vote", "stamp": ["GUILTY", "NOT GUILTY"], "stampcls": ["red", "green"], "doc": "CASE FILE · TRIAL SUMMARY", "ask": "Juror, how do you vote?", "tally": "plain"}, {"t": "quiz", "id": "v2", "tag": "ACT VI · VERDICT DESK 2", "q": "Video shows the defendant breaking a shop window. His fingerprints are on the safe, he was found an hour later with the stolen items, and he has no alibi. The defense says the jury can “imagine” a twin brother, but offers no evidence one exists.", "opts": ["GUILTY", "NOT GUILTY"], "ans": 0, "why": "An imagined possibility with no evidence is not a reasonable doubt, so the verdict is guilty.", "pts": 75, "kind": "vote", "stamp": ["GUILTY", "NOT GUILTY"], "stampcls": ["red", "green"], "doc": "CASE FILE · TRIAL SUMMARY", "ask": "Juror, how do you vote?", "tally": "plain"}, {"t": "quiz", "id": "v3", "tag": "ACT VI · VERDICT DESK 3", "q": "The defendant drove away in a car that wasn’t his. Unrebutted evidence shows it was the same model and color as his own, parked next to his, and his key fit both. He honestly believed it was his car.", "opts": ["GUILTY", "NOT GUILTY"], "ans": 1, "why": "Criminal intent is an element of the crime. Reasonable doubt about his state of mind means not guilty.", "pts": 75, "kind": "vote", "stamp": ["GUILTY", "NOT GUILTY"], "stampcls": ["red", "green"], "doc": "CASE FILE · TRIAL SUMMARY", "ask": "Juror, how do you vote?", "tally": "plain"}, {"t": "quiz", "id": "v4", "tag": "ACT VI · VERDICT DESK 4", "q": "Bank records, emails, and two coworkers all show the defendant altered records and moved $90,000 into a personal account. The defendant chose not to testify.", "opts": ["GUILTY", "NOT GUILTY"], "ans": 0, "why": "The evidence proves guilt beyond a reasonable doubt. His silence cannot be used against him, but it is not needed to convict.", "pts": 75, "kind": "vote", "stamp": ["GUILTY", "NOT GUILTY"], "stampcls": ["red", "green"], "doc": "CASE FILE · TRIAL SUMMARY", "ask": "Juror, how do you vote?", "tally": "plain"}, {"t": "quiz", "id": "v5", "tag": "ACT VI · VERDICT DESK 5", "q": "The prosecution tells jurors the defendant “seems like the type” and “probably did it.” There is no physical evidence, and the only witness admits he was not sure.", "opts": ["GUILTY", "NOT GUILTY"], "ans": 1, "why": "“Probably” and a hunch are not proof beyond a reasonable doubt, so the verdict is not guilty.", "pts": 75, "kind": "vote", "stamp": ["GUILTY", "NOT GUILTY"], "stampcls": ["red", "green"], "doc": "CASE FILE · TRIAL SUMMARY", "ask": "Juror, how do you vote?", "tally": "plain"}, {"t": "quiz", "id": "v6", "tag": "ACT VI · VERDICT DESK 6", "q": "A store clerk is shot during a robbery. The shooter was masked, but police find the defendant’s DNA on the mask, the stolen cash in his car, and his phone’s location data places him at the store. The defense argues only that “someone else could have borrowed the mask.” No evidence of this is offered.", "opts": ["GUILTY", "NOT GUILTY"], "ans": 0, "why": "Multiple independent pieces of evidence point to guilt, and the defense offers only speculation. That is not a reasonable doubt.", "pts": 75, "kind": "vote", "stamp": ["GUILTY", "NOT GUILTY"], "stampcls": ["red", "green"], "doc": "CASE FILE · TRIAL SUMMARY", "ask": "Juror, how do you vote?", "tally": "plain"}, {"t": "html", "title": "Evidence Locker: Key Terms", "body": "<div class=\"grid\" style=\"grid-template-columns:repeat(auto-fit,minmax(15rem,1fr))\"><div class=\"paper\"><div class=\"lbl\">ARRAIGNMENT<\/div><p class=\"small\">Charges read; plea entered.<\/p><\/div><div class=\"paper\"><div class=\"lbl\">BAIL<\/div><p class=\"small\">Money or conditions set by a judge for release before trial.<\/p><\/div><div class=\"paper\"><div class=\"lbl\">BRADY<\/div><p class=\"small\">Prosecutors must share evidence favorable to the defense.<\/p><\/div><div class=\"paper\"><div class=\"lbl\">BURDEN OF PROOF<\/div><p class=\"small\">The duty to prove a claim: on the prosecution in criminal cases.<\/p><\/div><div class=\"paper\"><div class=\"lbl\">CONTEMPT<\/div><p class=\"small\">Disobeying or disrespecting the court’s authority.<\/p><\/div><div class=\"paper\"><div class=\"lbl\">CROSS-EXAMINATION<\/div><p class=\"small\">Yes-or-no questioning of the other side’s witness.<\/p><\/div><div class=\"paper\"><div class=\"lbl\">DIRECT EXAMINATION<\/div><p class=\"small\">Open-ended questioning of your own witness.<\/p><\/div><div class=\"paper\"><div class=\"lbl\">DOUBLE JEOPARDY<\/div><p class=\"small\">No second trial for the same crime by the same government.<\/p><\/div><div class=\"paper\"><div class=\"lbl\">FELONY<\/div><p class=\"small\">Prison over a year (or a more serious class). function startHost(code,resume){
  hostCode=code||newCode();

    peer=new Peer('crimefile-'+hostCode,peerOpts(iceList));
    peer.on('open',function(){
      role='teacher';note('');persistHost();
      $('#land').hidden=true;renderSlide();
    });
    peer.on('connection',function(c){
      conns[c.connectionId]=c;
      c.on('data',function(m){onHostMsg(c,m);});

      c.on('error',function(){delete conns[c.connectionId];updateDynamic();});

      seq.appendChild(li);
    }
    var cs2=0;Object.keys(answers).forEach(function(kk){var p=answers[kk]&&answers[kk].picks?answers[kk].picks[s.id]:null;if(Array.isArray(p)&&p.length===s.items.length)cs2++;});
    var st3=q('status');
    q('seqlbl').textContent=rev2?'CORRECT ORDER':'YOUR ORDER';
    if(role==='teacher'){st3.textContent=cs2+' of '+joined()+' submitted';st3.className='status muted';}
    else if(rev2){
      if(arr.length!==s.items.length){st3.textContent='You didn’t finish the order this time.';st3.className='status muted';}
      else{var c=0;arr.forEach(function(v,i){if(v===i)c++;});st3.textContent=c+' of '+s.items.length+' in the right spot: +'+scoreSlide(s,me)+' XP';st3.className='status '+(c===s.items.length?'good':'muted');}
    } else {st3.textContent=arr.length===s.items.length?'Order locked in. Tap Clear to start over until the teacher reveals.':(arr.length+' of '+s.items.length+' placed');st3.className='status muted';}
    var why2=q('why');why2.hidden=!rev2;why2.textContent=rev2?s.why:'';
  }
  if(s.t==='open'){
    var form=q('openform'),on=q('opennote');var c3=(mine.texts[s.id]||[]).length;
    if(form){form.hidden=!canAnswer();var tc=$('#txtcount');if(tc)tc.textContent=c3+' of 3 sent';var sb2=$('#sendtxt');if(sb2)sb2.disabled=c3>=3;}
    if(on)on.textContent=canAnswer()?'Responses appear on the wall for the whole class to read.':'Responses appear below as students send them.';
    var wall=q('wall');if(wall){
      wall.textContent='';var all=[];
      Object.keys(answers).forEach(function(k){var t=answers[k]&&answers[k].texts&&answers[k].texts[s.id];if(Array.isArray(t))t.forEach(function(x){if(typeof x==='string')all.push(x);});});
      all.slice(0,80).forEach(function(x,i){var d=el('div','note2',x);d.style.setProperty('--r',((i%5)-2)*0.6+'deg');wall.appendChild(d);});
    }
  }
  if(s.t==='final'){fillBoard(q('board'),10);}
  if(!$('#boardov').hidden)fillBoard($('#boardlist'),10);
}

function fillBoard(host,max){
  if(!host)return;host.textContent='';
  var rows=Object.keys(answers).map(function(k){var d=answers[k];return {name:(d&&d.name)||'',xp:xpOf(d),doc:d};}).filter(function(r){return r.name;});
  rows.sort(function(a,b){return b.xp-a.xp||a.name.localeCompare(b.name);});
  var wrap=el('div');wrap.innerHTML=svgGauge(rows.map(function(r){return {step:stairsToken(r.doc)};}),true);host.appendChild(wrap);
  var list=el('div','board');
  if(!rows.length){list.appendChild(el('div','muted','No cases filed yet.'));}
  rows.slice(0,max).forEach(function(r,i){
    var d=el('div');d.appendChild(el('span','pos',String(i+1)));d.appendChild(el('span','nm',r.name));d.appendChild(el('span','rk',rankOf(r.xp)));d.appendChild(el('b',null,r.xp+' XP'));list.appendChild(d);
  });
  host.appendChild(list);
}

/* ---------- host controls ---------- */
function go(i){
  if(!isHost())return;
  i=Math.max(0,Math.min(N-1,i));if(i===state.idx)return;
  state.idx=i;pushState();renderSlide();
}
$('#prev').addEventListener('click',function(){go(state.idx-1);});
$('#next').addEventListener('click',function(){go(state.idx+1);});
$('#reveal').addEventListener('click',function(){var s=SL[state.idx];if(s.t!=='quiz'&&s.t!=='order')return;if(state.revealed[s.id])delete state.revealed[s.id];else state.revealed[s.id]=true;pushState();updateControls();updateDynamic();});
$('#live').addEventListener('change',function(e){state.live=e.target.checked;pushState();updateDynamic();});
$('#boardbtn').addEventListener('click',function(){$('#boardov').hidden=false;fillBoard($('#boardlist'),10);});
$('#boardclose').addEventListener('click',function(){$('#boardov').hidden=true;});
function studentLink(){return location.origin+location.pathname+'?c='+hostCode;}
$('#copylink').addEventListener('click',function(){
  var l=studentLink();
  try{navigator.clipboard.writeText(l).then(function(){note('Student link copied: '+l);},function(){note('Student link: '+l);});}catch(e){note('Student link: '+l);}
});
document.addEventListener('keydown',function(e){
  if(!isHost()||e.target.matches('input,textarea'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown')go(state.idx+1);
  if(e.key==='ArrowLeft'||e.key==='PageUp')go(state.idx-1);
});
var resetArmed=false;
$('#reset').addEventListener('click',function(){
  var b=$('#reset');
  if(!resetArmed){resetArmed=true;b.textContent='Click again to clear all answers';setTimeout(function(){resetArmed=false;b.textContent='Reset class';},4000);return;}
  resetArmed=false;b.textContent='Reset class';
  state={idx:0,revealed:{},live:false};answers={};persistHost();
  broadcast({t:'reset'});renderSlide();
});

/* ---------- join & landing ---------- */
function needJoin(){return canAnswer()&&!mine.name;}
function showJoin(){
  if(!needJoin()){$('#join').hidden=true;return;}
  var saved=lsGet('crimefile-nick')||'';
  if(!$('#nick').value)$('#nick').value=saved;
  $('#join').hidden=false;
}
function doJoin(){
  var v=$('#nick').value.trim().slice(0,18);if(!v)return;
  mine.name=v;lsSet('crimefile-nick',v);
  $('#join').hidden=true;saveMine();
}
$('#joinbtn').addEventListener('click',doJoin);
$('#nick').addEventListener('keydown',function(e){if(e.key==='Enter')doJoin();});

var qc=new URLSearchParams(location.search).get('c');
var saved=lsGet('crimefile-host');
if(saved&&saved.code){$('#resumebtn').hidden=false;$('#resumebtn').textContent='Resume my class ('+saved.code+')';}
$('#bTeacher').addEventListener('click',function(){state={idx:0,revealed:{},live:false};answers={};startHost(null,false);});
$('#resumebtn').addEventListener('click',function(){
  state=saved.state||state;state.revealed=state.revealed||{};answers=saved.answers||{};startHost(saved.code,true);
});
$('#bStudent').addEventListener('click',function(){$('#stuform').hidden=false;$('#codein').focus();});
function goStudent(){var c=$('#codein').value;if(c.trim())startStudent(c);}
$('#codego').addEventListener('click',goStudent);
$('#codein').addEventListener('keydown',function(e){if(e.key==='Enter')goStudent();});
$('#bSolo').addEventListener('click',function(){role='solo';myUid='local';$('#land').hidden=true;note('Solo mode: answers stay on this device.');renderSlide();showJoin();});
if(qc){$('#stuform').hidden=false;$('#codein').value=qc.toUpperCase();}

(function buildJump(){
  var j=$('#jump');j.appendChild(new Option('Jump to…',''));
  SL.forEach(function(s,i){if(i===0||s.t==='act'||s.t==='final')j.appendChild(new Option(s.t==='act'?s.no+': '+s.title:(s.t==='final'?'Finale':'Start'),String(i)));});
  j.addEventListener('change',function(){if(j.value!==''){go(Number(j.value));j.value='';}});
})();
role='lobby';
renderSlide();
})();
</script>
